<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totally Pizza</title>
    <!-- Favicon-->
    <link rel="icon" href="Images/PizzaIcon.webp">
    <link rel="stylesheet" href="styles/pizza-styles.css">
</head>
<body>
    <div id="main">
        <div id="header">
            <img src="Images/pizza_guy.jpg" alt="Pizza Guy">
             <h1>Welcome to Totally Pizza</h1>
            <h2>Where your pizza is <em>definitely</em> pizza</h2>
            <hr>
            <p>We make pizza that is made out of pizza, please dine here today.</p>
            <a id="contact-button" href="#" role="button">Contact Us</a>
        </div>
        <form id="pizza-form" action="#" method="get">
            <!-- Contact Info -->
            <fieldset>
                <legend>Contact Info</legend>
                <label for="fname">First Name</label>
                <input type="text" name="fname" id="fname">
                <label for="lname">Last Name</label>
                <input type="text" name="lname" id="lname">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
                
            </fieldset>
            <!-- Delivery or Pickup -->
            <fieldset>
                <legend>SELECT PICKUP OR DELIVERY</legend>
                <label for="pickup">
                    <input type="radio" id="pickup" name="method" value="pickup">
                    Pickup
                </label>
                <label for="delivery">
                    <input type="radio" id="delivery" name="method" value="delivery">
                    Delivery
                </label>
            </fieldset>
            <!-- Select Toppings -->
            <fieldset>
                <Legend>SELECT TOPPINGS</Legend>
                <label for="pepperoni">
                    <input type="checkbox" id="pepperoni" name="toppings[]" value="pepperoni">
                    Pepperoni
                </label>
                <label for="onion">
                    <input type="checkbox" id="onion" name="toppings[]" value="onion">
                    Onions
                </label>
                <label for="pepper">
                    <input type="checkbox" id="pepper" name="toppings[]" value="pepper">
                    Peppers
                </label>
                <label for="chicken">
                    <input type="checkbox" id="chicken" name="toppings[]" value="chicken">
                    Chicken
                </label>
                <label for="olive">
                    <input type="checkbox" id="olive" name="toppings[]" value="olive">
                    Olives
                </label>
            </fieldset>
            <!-- Select Pizza Size -->
            <fieldset>
                <legend>Pizza Size</legend>
                <select name="size" id="size">
                    <option value="none">-- Select a Size --</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </fieldset>

            <!-- Comment Field -->
             <label for="comment">Comments</label>
             <textarea rows="5" name="comment" id="comment"></textarea>

            <!-- Order button -->
            <button type="submit" id="order_button">Place Order</button>
        </form>

       
    </div>
</body>
</html>
